<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Minigolf</title>
</head>
<body>

<script>
fetch("Minigolf.html")
  .then(response => {
    if (!response.ok) throw new Error("Could not load Minigolf.html");
    return response.text();
  })
  .then(html => {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error => {
    document.body.innerHTML = "Error loading Minigolf.html";
    console.error(error);
  });
</script>

</body>
</html>
